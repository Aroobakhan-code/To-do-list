
<!DOCTYPE html>
<html>
<head>
    <title>To-do-list</title>
    </head>
    <style>
        body{
            min-width: 100%;
            background: url(https://i.pinimg.com/1200x/d3/9c/3d/d39c3dcea36e709ce7413fc4ea37f888.jpg);
            object-fit: cover;
            text-align: center;
            justify-content: center;
            align-items: center;
            background-size: cover;
           
            background-repeat: no-repeat;
        
        }
        .card{
           background-color: rgba(255, 255, 255, 0.2);
           width: 600px;
           height: auto;
           text-align: center;
           border: 1px solid rgba(255, 255, 255, 0.9);
           margin-left: 30%;
           margin-top: 10%;
           border-radius: 8px;
           padding: 70px;
           
        }
        .text{
            color: white;
            text-align: center;
            margin-top: 10%;
        }
        #task{
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 4px;
            padding: 10px;
            width: 400px;
            color: white;
            outline: none;

             }
        #addbtn{
            background-color:rgba(255, 255, 255, 0.2) ;
            color: white;
            border: none;
            font-size: 15px;
           height: 35px;
           gap: 15px;
           width: 30px;
           outline: none;
          
        }
        #input-container{
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: sans-serif;
            
        }
        .todo-container{
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            gap: 15px;
            justify-content: space-between;
            margin-top: 30px;
            padding: 5px;
            width: 450px;
            color: white;
            margin-left: 70px;
            border-radius: 5px;
            height: 40px;
            align-items: center;
           
            
            
        
        }
        .delete-button{
            background-color: rgba(255, 255, 255, 0.7);
            color: black;
            padding: 0px;
            border-radius: 5px;
            width: 80px;
            border: none;
            gap: 15px;
            height: 40px;
            margin-top: 6px;
            align-items: center;
            margin-bottom: 5px;
        }
        .delete-button:hover{
            background-color: red;
        }
        .task-text{
            color: white;
            font-size: 18px;
            margin-left: 10px;
        }
        #addbtn:hover{
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }


       
    </style>
    <body>
        <div class="card">
            <h1 class="text">To do list</h1>
            <div class="input-container">
                <input type="text" id="task" placeholder="Add a task">
                <button id="addbtn">+</button>
                 <div id="task-container"></div>
            </div>
        </div>
    </body>
    <script>
        let task = document.getElementById("task");
        let addbtn = document.getElementById("addbtn");
        let taskcontainer = document.getElementById("task-container");

        addbtn.addEventListener("click", () => {

            if (task.value.trim() === "") {
    alert("Please Enter a task!");
    return;
            }
        

            let todoWrapper = document.createElement("div");
            let deleteButton = document.createElement("button");
            let tasktext = document.createElement("p");

            todoWrapper.classList.add("todo-container");
            deleteButton.classList.add("delete-button");
            tasktext.classList.add("task-text");

            tasktext.textContent = task.value;

            deleteButton.textContent = "Delete";

            todoWrapper.append(tasktext);
            todoWrapper.append(deleteButton);

            taskcontainer.append(todoWrapper);
        

            deleteButton.addEventListener("click", () => {
                todoWrapper.remove();
            });
            task.value = "";
        });

        


        </script>

    </html>
